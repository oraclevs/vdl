<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>vdl — control room</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,300..700,0..100,0..1&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0b0d;
      --bg-2: #101218;
      --panel: #15171c;
      --panel-2: #1b1e25;
      --edge: #262a33;
      --edge-soft: #1d2027;
      --ink: #ece8e1;
      --ink-dim: #95968f;
      --ink-faint: #65665f;
      --amber: #ffb648;
      --amber-glow: rgba(255, 182, 72, .38);
      --cyan: #79e7da;
      --cyan-glow: rgba(121, 231, 218, .32);
      --green: #8be3a1;
      --red: #ff7a7a;
      --radius-lg: 16px;
      --radius-md: 10px;
      --display: 'Fraunces', ui-serif, Georgia, serif;
      --mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', monospace;
      --ease: cubic-bezier(.22, .9, .27, 1);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--mono);
      font-size: 14px;
      line-height: 1.55;
      letter-spacing: .01em;
      position: relative;
      overflow-x: hidden;
    }
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: -2;
      background:
        radial-gradient(ellipse at 18% -8%, rgba(255, 182, 72, .09), transparent 45%),
        radial-gradient(ellipse at 92% 112%, rgba(121, 231, 218, .07), transparent 50%),
        var(--bg);
    }
    .scanlines {
      position: fixed; inset: 0; z-index: -1; pointer-events: none; opacity: .5;
      mix-blend-mode: overlay;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255, 255, 255, .018) 0px,
        rgba(255, 255, 255, .018) 1px,
        transparent 1px,
        transparent 3px
      );
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    /* ---- header ---- */
    .bridge {
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 14px;
      padding: 28px clamp(20px, 4vw, 56px) 18px;
      border-bottom: 1px solid var(--edge-soft);
    }
    .wordmark { display: flex; align-items: baseline; gap: 14px; }
    .wordmark .glyph {
      font-family: var(--display); font-weight: 600; font-size: 34px;
      font-variation-settings: 'opsz' 72, 'SOFT' 30, 'WONK' 1;
      letter-spacing: -.02em;
    }
    .wordmark .glyph:nth-child(1) { color: var(--amber); }
    .wordmark .glyph:nth-child(2) { color: var(--ink); }
    .wordmark .glyph:nth-child(3) { color: var(--cyan); }
    .tagline {
      font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--ink-faint);
      align-self: center; padding-left: 14px; margin-left: 4px; border-left: 1px solid var(--edge);
    }
    .status-cluster { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .status-pill {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 7px 14px; border-radius: 999px; border: 1px solid var(--edge); background: var(--panel);
      font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
    }
    .status-pill .dot {
      width: 8px; height: 8px; border-radius: 50%; background: var(--ink-faint);
      transition: background .3s, box-shadow .3s;
    }
    .status-pill[data-state="live"] .dot { background: var(--cyan); box-shadow: 0 0 10px var(--cyan-glow); animation: pulse 2.4s ease-in-out infinite; }
    .status-pill[data-state="connecting"] .dot { background: var(--amber); box-shadow: 0 0 10px var(--amber-glow); }
    .status-pill[data-state="offline"] .dot { background: var(--red); box-shadow: 0 0 10px rgba(255, 122, 122, .35); }
    .addr { color: var(--ink-faint); font-size: 11px; letter-spacing: .04em; }
    .ghost-btn {
      background: transparent; border: 1px solid var(--edge); color: var(--ink-dim);
      padding: 9px 17px; border-radius: 8px; font-family: var(--mono); font-size: 12px;
      letter-spacing: .05em; cursor: pointer; transition: all .2s var(--ease);
    }
    .ghost-btn:hover { color: var(--ink); border-color: var(--amber); box-shadow: 0 0 0 1px var(--amber) inset; }

    /* ---- layout ---- */
    .deck {
      display: grid; grid-template-columns: minmax(380px, 1.05fr) minmax(360px, 1fr);
      gap: 28px; padding: 32px clamp(20px, 4vw, 56px) 80px; align-items: start;
    }
    @media (max-width: 980px) { .deck { grid-template-columns: 1fr; } }
    .console, .rack {
      background: linear-gradient(180deg, var(--panel), var(--panel-2));
      border: 1px solid var(--edge-soft); border-radius: var(--radius-lg);
      padding: 28px; position: relative; box-shadow: 0 30px 80px -45px rgba(0, 0, 0, .65);
    }
    .console::after, .rack::after {
      content: ''; position: absolute; top: 0; left: 26px; right: 26px; height: 1px;
    }
    .console::after { background: linear-gradient(90deg, transparent, var(--amber-glow), transparent); }
    .rack::after { background: linear-gradient(90deg, transparent, var(--cyan-glow), transparent); }
    .panel-head { margin-bottom: 22px; }
    .panel-head h2 {
      font-family: var(--display); font-weight: 600; font-size: 22px; margin: 0 0 4px;
      font-variation-settings: 'opsz' 30, 'SOFT' 20;
    }
    .panel-sub { color: var(--ink-faint); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; }

    /* ---- channel select ---- */
    .channel-select { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
    .channel {
      font-family: var(--mono); font-size: 12px; letter-spacing: .05em;
      padding: 10px 18px; border-radius: 8px; background: var(--bg-2); border: 1px solid var(--edge);
      color: var(--ink-dim); cursor: pointer; transition: all .25s var(--ease);
    }
    .channel:hover { color: var(--ink); border-color: var(--ink-faint); }
    .channel[aria-pressed="true"] {
      color: var(--bg); background: var(--amber); border-color: var(--amber);
      box-shadow: 0 0 24px -4px var(--amber-glow); font-weight: 600;
    }
    .channel[data-disabled="true"] { opacity: .42; cursor: not-allowed; }
    .channel[data-disabled="true"] small {
      display: block; margin-top: 2px; font-size: 9px; letter-spacing: .14em; text-transform: uppercase; opacity: .8;
    }

    /* ---- fields ---- */
    .field { display: flex; flex-direction: column; gap: 7px; }
    .field-label { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-faint); }
    .field-label em { font-style: normal; color: var(--red); opacity: .85; font-size: 9px; letter-spacing: .08em; }
    .field input, .field select {
      font-family: var(--mono); font-size: 13px; color: var(--ink);
      background: var(--bg-2); border: 1px solid var(--edge); border-radius: 8px;
      padding: 11px 14px; outline: none; transition: border-color .2s, box-shadow .2s;
      width: 100%;
    }
    .field input::placeholder { color: var(--ink-faint); }
    .field input:focus, .field select:focus { border-color: var(--amber); box-shadow: 0 0 0 3px var(--amber-glow); }
    .field-row { display: flex; gap: 12px; align-items: flex-end; margin-bottom: 18px; }
    .field-row .url-field { flex: 1; }
    .field-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 20px; }
    .field-hint { font-size: 11px; color: var(--ink-faint); margin: -6px 0 16px; }

    /* ---- buttons ---- */
    .btn {
      font-family: var(--mono); font-size: 13px; letter-spacing: .04em;
      padding: 11px 22px; border-radius: 8px; cursor: pointer; border: 1px solid transparent;
      transition: transform .15s var(--ease), box-shadow .2s, background .2s, color .2s, border-color .2s, opacity .2s;
    }
    .btn:active { transform: translateY(1px); }
    .btn.primary { background: var(--amber); color: #1a1305; font-weight: 600; box-shadow: 0 8px 30px -10px var(--amber-glow); }
    .btn.primary:hover:not(:disabled) { filter: brightness(1.06); box-shadow: 0 8px 36px -8px var(--amber-glow); }
    .btn.primary.big { padding: 14px 32px; font-size: 14px; }
    .btn.primary:disabled { background: var(--edge); color: var(--ink-faint); box-shadow: none; cursor: not-allowed; }
    .btn.ghost { background: transparent; border-color: var(--edge); color: var(--ink-dim); }
    .btn.ghost:hover { color: var(--ink); border-color: var(--ink-faint); }
    .btn.small { padding: 7px 14px; font-size: 11px; }
    .btn.is-busy { opacity: .55; pointer-events: none; }

    /* ---- rocker switches ---- */
    .switch-row { display: flex; flex-wrap: wrap; gap: 24px; margin-bottom: 22px; }
    .rocker { display: flex; align-items: center; gap: 11px; cursor: pointer; }
    .rocker input { position: absolute; opacity: 0; width: 0; height: 0; }
    .rocker-track {
      width: 40px; height: 22px; border-radius: 999px; background: var(--bg-2);
      border: 1px solid var(--edge); position: relative; transition: background .25s, border-color .25s; flex-shrink: 0;
    }
    .rocker-thumb {
      position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%;
      background: var(--ink-faint); transition: transform .25s var(--ease), background .25s, box-shadow .25s;
    }
    .rocker input:checked + .rocker-track { background: rgba(255, 182, 72, .16); border-color: var(--amber); }
    .rocker input:checked + .rocker-track .rocker-thumb { transform: translateX(18px); background: var(--amber); box-shadow: 0 0 12px var(--amber-glow); }
    .rocker input:disabled + .rocker-track { opacity: .4; }
    .rocker-label { font-size: 12px; color: var(--ink-dim); letter-spacing: .03em; }

    /* ---- metadata preview ---- */
    .meta-card {
      display: flex; gap: 18px; align-items: center; background: var(--bg-2);
      border: 1px solid var(--edge); border-radius: var(--radius-md); padding: 16px;
      margin-bottom: 20px; animation: rise .35s var(--ease);
    }
    .meta-thumb { width: 120px; height: 68px; object-fit: cover; border-radius: 6px; border: 1px solid var(--edge); flex-shrink: 0; }
    .meta-thumb--empty {
      display: flex; align-items: center; justify-content: center; color: var(--ink-faint);
      font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
    }
    .meta-title { margin: 0 0 6px; font-family: var(--display); font-size: 17px; font-weight: 600; color: var(--ink); }
    .meta-sub { margin: 0; font-size: 11px; color: var(--ink-faint); letter-spacing: .04em; }

    .error-banner {
      background: rgba(255, 122, 122, .1); border: 1px solid rgba(255, 122, 122, .35); color: var(--red);
      padding: 12px 16px; border-radius: 8px; font-size: 12px; margin-bottom: 18px; animation: rise .25s var(--ease);
    }
    .console-actions { display: flex; justify-content: space-between; align-items: center; gap: 12px; }

    /* ---- session rack ---- */
    .session-list { display: flex; flex-direction: column; gap: 14px; max-height: 660px; overflow-y: auto; padding-right: 4px; margin: 0; list-style: none; }
    .session-list::-webkit-scrollbar { width: 6px; }
    .session-list::-webkit-scrollbar-thumb { background: var(--edge); border-radius: 3px; }
    .empty-note { color: var(--ink-faint); font-size: 12px; text-align: center; padding: 56px 0; margin: 0; letter-spacing: .04em; }

    .session-card {
      display: flex; gap: 14px; position: relative; overflow: hidden;
      background: var(--bg-2); border: 1px solid var(--edge); border-radius: var(--radius-md);
      padding: 16px 18px 16px 22px; animation: rise .3s var(--ease);
    }
    .session-accent { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
    .tone-amber .session-accent, .tone-amber .meter-fill { background: var(--amber); }
    .tone-cyan .session-accent, .tone-cyan .meter-fill { background: var(--cyan); }
    .tone-green .session-accent, .tone-green .meter-fill { background: var(--green); }
    .tone-red .session-accent, .tone-red .meter-fill { background: var(--red); }
    .tone-dim .session-accent, .tone-dim .meter-fill { background: var(--ink-faint); }
    .session-body { flex: 1; min-width: 0; }
    .session-top { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
    .chip {
      font-size: 10px; letter-spacing: .1em; text-transform: uppercase; padding: 4px 9px;
      border-radius: 5px; background: var(--panel-2); border: 1px solid var(--edge); color: var(--ink-dim);
    }
    .session-url { font-size: 12px; color: var(--ink-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 80px; }
    .badge {
      font-size: 10px; letter-spacing: .08em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px;
      display: inline-flex; align-items: center; gap: 6px; border: 1px solid currentColor;
    }
    .badge.tone-amber { color: var(--amber); }
    .badge.tone-cyan { color: var(--cyan); }
    .badge.tone-green { color: var(--green); }
    .badge.tone-red { color: var(--red); }
    .badge.tone-dim { color: var(--ink-faint); }
    .blink { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: pulse 1.1s ease-in-out infinite; }
    .session-title { margin: 0 0 10px; font-size: 13px; color: var(--ink); }
    .session-title .dim { color: var(--ink-faint); font-weight: 400; }
    .meter { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
    .meter-track { flex: 1; height: 8px; border-radius: 999px; background: var(--panel-2); overflow: hidden; border: 1px solid var(--edge); }
    .meter-fill { height: 100%; border-radius: 999px; transition: width .4s var(--ease); box-shadow: 0 0 14px currentColor; }
    .meter-readout { font-family: var(--display); font-size: 15px; font-weight: 600; min-width: 56px; text-align: right; font-variant-numeric: tabular-nums; }
    .session-stats { display: flex; gap: 16px; font-size: 11px; color: var(--ink-faint); letter-spacing: .04em; flex-wrap: wrap; }
    .session-note { margin: 8px 0 0; font-size: 11px; word-break: break-all; }
    .session-note.tone-complete { color: var(--green); }
    .session-note.tone-error { color: var(--red); }
    .cancel-btn { align-self: flex-start; }

    /* ---- settings drawer ---- */
    .drawer-overlay {
      position: fixed; inset: 0; background: rgba(5, 6, 8, .6); backdrop-filter: blur(2px);
      opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 40;
    }
    .drawer-overlay.show { opacity: 1; pointer-events: all; }
    .drawer {
      position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 100%);
      background: var(--panel); border-left: 1px solid var(--edge-soft);
      transform: translateX(100%); transition: transform .35s var(--ease);
      z-index: 41; display: flex; flex-direction: column;
    }
    .drawer.open { transform: translateX(0); }
    .drawer-head { display: flex; justify-content: space-between; align-items: center; padding: 24px 28px; border-bottom: 1px solid var(--edge-soft); }
    .drawer-head h2 { font-family: var(--display); margin: 0; font-size: 20px; font-weight: 600; }
    .drawer-body { flex: 1; overflow-y: auto; padding: 24px 28px; display: flex; flex-direction: column; gap: 20px; }
    .drawer-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 20px 28px; border-top: 1px solid var(--edge-soft); }
    .quality-grid { border: 1px solid var(--edge); border-radius: var(--radius-md); padding: 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 14px; margin: 0; }
    .quality-grid legend { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-faint); padding: 0 6px; }

    /* ---- toasts ---- */
    .toast-rack { position: fixed; bottom: 24px; right: 24px; display: flex; flex-direction: column; gap: 10px; z-index: 60; max-width: calc(100vw - 48px); }
    .toast {
      font-size: 12px; letter-spacing: .03em; padding: 13px 18px; border-radius: 8px;
      background: var(--panel-2); border: 1px solid var(--edge); color: var(--ink);
      box-shadow: 0 20px 50px -20px rgba(0, 0, 0, .7);
      opacity: 0; transform: translateY(8px) scale(.97); transition: all .3s var(--ease);
      max-width: 340px;
    }
    .toast.show { opacity: 1; transform: none; }
    .toast--success { border-color: rgba(139, 227, 161, .4); }
    .toast--error { border-color: rgba(255, 122, 122, .4); color: var(--red); }
    .toast--warn { border-color: rgba(255, 182, 72, .4); color: var(--amber); }

    @media (max-width: 640px) {
      .bridge { flex-direction: column; align-items: flex-start; }
      .field-row { flex-direction: column; align-items: stretch; }
      .field-row .btn { align-self: flex-end; }
    }
  </style>
</head>
<body>
  <div class="scanlines"></div>

  <header class="bridge">
    <div class="wordmark">
      <span class="glyph">v</span><span class="glyph">d</span><span class="glyph">l</span>
      <span class="tagline">control room</span>
    </div>
    <div class="status-cluster">
      <span class="status-pill" id="ws-status" data-state="connecting"><i class="dot"></i><span class="label">connecting…</span></span>
      <span class="addr" id="server-addr"></span>
      <button class="ghost-btn" id="settings-toggle" type="button">⚙ settings</button>
    </div>
  </header>

  <main class="deck">
    <section class="console" aria-label="Download console">
      <div class="panel-head">
        <h2>new transfer</h2>
        <span class="panel-sub">select source · paste url · preview · launch</span>
      </div>

      <div class="channel-select" role="tablist" id="channel-select">
        <button class="channel" data-platform="yt" aria-pressed="true" type="button">YouTube</button>
        <button class="channel" data-platform="tk" aria-pressed="false" type="button">TikTok</button>
        <button class="channel" data-platform="ig" aria-pressed="false" type="button">Instagram</button>
        <button class="channel" data-platform="tw" aria-pressed="false" type="button">Twitter / X</button>
        <button class="channel" data-platform="sp" data-disabled="true" aria-pressed="false" type="button">Spotify<small>web ui — soon</small></button>
      </div>

      <div class="field-row">
        <label class="field url-field">
          <span class="field-label">source url</span>
          <input type="url" id="url-input" placeholder="https://…" autocomplete="off" spellcheck="false">
        </label>
        <button class="btn primary" id="preview-btn" type="button">preview ⏎</button>
      </div>

      <div class="field-grid">
        <label class="field">
          <span class="field-label">quality</span>
          <select id="quality-select">
            <option value="">platform default</option>
            <option value="best">best</option>
            <option value="1080">1080p</option>
            <option value="720">720p</option>
            <option value="480">480p</option>
            <option value="360">360p</option>
            <option value="worst">worst</option>
          </select>
        </label>
        <label class="field">
          <span class="field-label">container</span>
          <select id="format-select">
            <option value="">platform default</option>
            <option value="mp4">mp4</option>
            <option value="mkv">mkv</option>
            <option value="webm">webm</option>
            <option value="mp3">mp3 — audio</option>
            <option value="m4a">m4a — audio</option>
            <option value="opus">opus — audio</option>
          </select>
        </label>
        <label class="field">
          <span class="field-label">output directory</span>
          <input type="text" id="output-input" placeholder="default download path">
        </label>
      </div>

      <div class="switch-row">
        <label class="rocker">
          <input type="checkbox" id="audio-only-toggle">
          <span class="rocker-track"><span class="rocker-thumb"></span></span>
          <span class="rocker-label">audio only</span>
        </label>
        <label class="rocker">
          <input type="checkbox" id="video-only-toggle">
          <span class="rocker-track"><span class="rocker-thumb"></span></span>
          <span class="rocker-label">video only — no audio</span>
        </label>
      </div>

      <div class="meta-card" id="meta-card" hidden></div>
      <div class="error-banner" id="console-error" hidden></div>

      <div class="console-actions">
        <button class="btn ghost" id="clear-btn" type="button">clear</button>
        <button class="btn primary big" id="start-btn" type="button" disabled>▶ start transfer</button>
      </div>
    </section>

    <section class="rack" aria-label="Transfer sessions">
      <div class="panel-head">
        <h2>sessions</h2>
        <span class="panel-sub" id="session-count">0 active · 0 total</span>
      </div>
      <ul class="session-list" id="session-list">
        <p class="empty-note">no transfers yet — queue one from the console</p>
      </ul>
    </section>
  </main>

  <div class="drawer-overlay" id="drawer-overlay"></div>
  <aside class="drawer" id="settings-drawer" aria-hidden="true">
    <div class="drawer-head">
      <h2>settings</h2>
      <button class="ghost-btn" id="drawer-close" type="button">✕ close</button>
    </div>
    <div class="drawer-body" id="settings-body">
      <p class="panel-sub">loading current configuration…</p>
    </div>
    <div class="drawer-foot">
      <button class="btn ghost" id="settings-reset" type="button">revert</button>
      <button class="btn primary" id="settings-save" type="button">save changes</button>
    </div>
  </aside>

  <div class="toast-rack" id="toast-rack"></div>

  <script>
    (() => {
      const PLATFORM_LABELS = { yt: 'YouTube', tk: 'TikTok', ig: 'Instagram', tw: 'Twitter/X', sp: 'Spotify' };
      const QUALITIES = ['best', '1080', '720', '480', '360', 'worst'];
      const FORMATS = ['mp4', 'mkv', 'webm', 'mp3', 'm4a', 'opus'];
      const AUDIO_FORMATS = new Set(['mp3', 'm4a', 'opus']);
      const STATUS_INFO = {
        pending: { label: 'queued', tone: 'dim' },
        fetching_metadata: { label: 'reading metadata', tone: 'cyan' },
        downloading: { label: 'transferring', tone: 'amber' },
        merging: { label: 'finalizing', tone: 'amber' },
        complete: { label: 'complete', tone: 'green' },
        error: { label: 'failed', tone: 'red' },
        cancelled: { label: 'cancelled', tone: 'dim' },
      };

      const els = {
        wsStatus: document.getElementById('ws-status'),
        serverAddr: document.getElementById('server-addr'),
        settingsToggle: document.getElementById('settings-toggle'),
        channelSelect: document.getElementById('channel-select'),
        urlInput: document.getElementById('url-input'),
        previewBtn: document.getElementById('preview-btn'),
        qualitySelect: document.getElementById('quality-select'),
        formatSelect: document.getElementById('format-select'),
        outputInput: document.getElementById('output-input'),
        audioOnly: document.getElementById('audio-only-toggle'),
        videoOnly: document.getElementById('video-only-toggle'),
        metaCard: document.getElementById('meta-card'),
        consoleError: document.getElementById('console-error'),
        clearBtn: document.getElementById('clear-btn'),
        startBtn: document.getElementById('start-btn'),
        sessionCount: document.getElementById('session-count'),
        sessionList: document.getElementById('session-list'),
        drawer: document.getElementById('settings-drawer'),
        drawerOverlay: document.getElementById('drawer-overlay'),
        drawerClose: document.getElementById('drawer-close'),
        settingsBody: document.getElementById('settings-body'),
        settingsReset: document.getElementById('settings-reset'),
        settingsSave: document.getElementById('settings-save'),
        toastRack: document.getElementById('toast-rack'),
      };

      const state = {
        platform: 'yt',
        sessions: new Map(),
        ws: null,
        wsReady: false,
        config: null,
      };
      const subscribedIds = new Set();
      const pendingSubs = [];

      // ---------- helpers ----------
      function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>"']/g, (c) => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
        }[c]));
      }

      function shortenUrl(url) {
        try {
          const u = new URL(url);
          const path = u.pathname.length > 28 ? u.pathname.slice(0, 28) + '…' : u.pathname;
          return u.hostname.replace(/^www\./, '') + path;
        } catch {
          return url.length > 40 ? url.slice(0, 40) + '…' : url;
        }
      }

      function formatDuration(totalSeconds) {
        const s = Math.max(0, Math.floor(totalSeconds));
        const h = Math.floor(s / 3600);
        const m = Math.floor((s % 3600) / 60);
        const sec = s % 60;
        return h > 0
          ? `${h}:${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`
          : `${m}:${String(sec).padStart(2, '0')}`;
      }

      function isFinished(status) {
        return status === 'complete' || status === 'error' || status === 'cancelled';
      }

      function showToast(message, kind = 'info') {
        const el = document.createElement('div');
        el.className = `toast toast--${kind}`;
        el.textContent = message;
        els.toastRack.appendChild(el);
        requestAnimationFrame(() => el.classList.add('show'));
        setTimeout(() => {
          el.classList.remove('show');
          setTimeout(() => el.remove(), 320);
        }, 4400);
      }

      function setBusy(btn, busy) {
        btn.disabled = busy;
        btn.classList.toggle('is-busy', busy);
      }

      async function api(method, path, body) {
        const init = { method };
        if (body !== undefined) {
          init.headers = { 'content-type': 'application/json' };
          init.body = JSON.stringify(body);
        }
        const res = await fetch(path, init);
        let data = null;
        try { data = await res.json(); } catch { /* empty body */ }
        if (!res.ok) {
          const message = (data && data.error) || `Request failed (${res.status})`;
          throw new Error(message);
        }
        return data;
      }

      // ---------- platform channel select ----------
      els.channelSelect.addEventListener('click', (e) => {
        const btn = e.target.closest('.channel');
        if (!btn) return;
        if (btn.dataset.disabled === 'true') {
          showToast('Spotify downloads are not yet available through the web API — use the CLI for now.', 'warn');
          return;
        }
        state.platform = btn.dataset.platform;
        [...els.channelSelect.children].forEach((b) => b.setAttribute('aria-pressed', String(b === btn)));
        hideMeta();
        hideConsoleError();
      });

      // ---------- audio/video-only mutual exclusivity (mirrors CommonArgs `conflicts_with`) ----------
      els.audioOnly.addEventListener('change', () => {
        if (els.audioOnly.checked) els.videoOnly.checked = false;
      });
      els.videoOnly.addEventListener('change', () => {
        if (els.videoOnly.checked) els.audioOnly.checked = false;
      });
      els.formatSelect.addEventListener('change', () => {
        const isAudioFormat = AUDIO_FORMATS.has(els.formatSelect.value);
        els.videoOnly.disabled = isAudioFormat;
        if (isAudioFormat) {
          els.audioOnly.checked = true;
          els.videoOnly.checked = false;
        }
      });

      els.urlInput.addEventListener('input', hideConsoleError);
      els.urlInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') fetchMetadata(); });
      els.previewBtn.addEventListener('click', fetchMetadata);

      function showConsoleError(message) {
        els.consoleError.hidden = false;
        els.consoleError.textContent = message;
      }
      function hideConsoleError() { els.consoleError.hidden = true; }

      function hideMeta() {
        els.metaCard.hidden = true;
        els.metaCard.innerHTML = '';
        els.startBtn.disabled = true;
      }

      function renderMeta(data) {
        const durationText = data.duration != null ? formatDuration(data.duration) : '—';
        els.metaCard.hidden = false;
        els.metaCard.innerHTML = `
          ${data.thumbnail
            ? `<img class="meta-thumb" src="${escapeHtml(data.thumbnail)}" alt="">`
            : '<div class="meta-thumb meta-thumb--empty">no preview</div>'}
          <div class="meta-info">
            <p class="meta-title">${escapeHtml(data.title)}</p>
            <p class="meta-sub">${escapeHtml(data.uploader || 'unknown uploader')} · ${durationText} · ${data.formats.length} formats available</p>
          </div>`;
      }

      async function fetchMetadata() {
        const url = els.urlInput.value.trim();
        hideConsoleError();
        if (!url) { showConsoleError('Enter a source URL first.'); return; }
        setBusy(els.previewBtn, true);
        try {
          const data = await api('POST', '/api/fetch-metadata', { url, platform: state.platform });
          renderMeta(data);
          els.startBtn.disabled = false;
        } catch (err) {
          hideMeta();
          showConsoleError(err.message);
        } finally {
          setBusy(els.previewBtn, false);
        }
      }

      // ---------- start transfer ----------
      els.startBtn.addEventListener('click', startDownload);
      async function startDownload() {
        const url = els.urlInput.value.trim();
        if (!url) return;
        const payload = {
          platform: state.platform,
          url,
          quality: els.qualitySelect.value || null,
          format: els.formatSelect.value || null,
          audio_only: els.audioOnly.checked,
          video_only: els.videoOnly.checked,
          start: null,
          end: null,
          output_dir: els.outputInput.value.trim() || null,
        };
        setBusy(els.startBtn, true);
        try {
          const data = await api('POST', '/api/download', payload);
          const id = data.session_id;
          addSession(id, { url, platform: state.platform, status: 'pending', progress: 0 });
          subscribe(id);
          renderSessions();
          showToast('Transfer queued — watch it land in the rack →', 'success');
        } catch (err) {
          showConsoleError(err.message);
        } finally {
          setBusy(els.startBtn, false);
        }
      }

      els.clearBtn.addEventListener('click', () => {
        els.urlInput.value = '';
        els.qualitySelect.value = '';
        els.formatSelect.value = '';
        els.audioOnly.checked = false;
        els.videoOnly.checked = false;
        els.videoOnly.disabled = false;
        els.outputInput.value = '';
        hideMeta();
        hideConsoleError();
      });

      // ---------- session bookkeeping ----------
      function blankSession(id) {
        return {
          id, url: '', platform: 'yt', status: 'pending', progress: 0,
          speed: null, eta: null, size: null,
          title: null, uploader: null, outputPath: null, errorMessage: null,
        };
      }
      function addSession(id, patch) {
        if (!state.sessions.has(id)) state.sessions.set(id, Object.assign(blankSession(id), patch));
      }
      function updateSession(id, patch) {
        const existing = state.sessions.get(id) || blankSession(id);
        state.sessions.set(id, Object.assign(existing, patch));
        renderSessions();
      }
      function syncFromList(list) {
        list.forEach((item) => {
          const existing = state.sessions.get(item.session_id);
          if (existing) {
            Object.assign(existing, { status: item.status, progress: item.progress, url: item.url, platform: item.platform });
          } else {
            addSession(item.session_id, { url: item.url, platform: item.platform, status: item.status, progress: item.progress });
          }
          if (!isFinished(item.status)) subscribe(item.session_id);
        });
        renderSessions();
      }

      function renderSessions() {
        const items = [...state.sessions.values()];
        const active = items.filter((s) => !isFinished(s.status));
        els.sessionCount.textContent = `${active.length} active · ${items.length} total`;
        if (items.length === 0) {
          els.sessionList.innerHTML = '<p class="empty-note">no transfers yet — queue one from the console</p>';
          return;
        }
        const ordered = [...items].sort((a, b) => Number(isFinished(a.status)) - Number(isFinished(b.status)));
        els.sessionList.innerHTML = ordered.map(renderSessionCard).join('');
      }

      function renderSessionCard(s) {
        const finished = isFinished(s.status);
        const info = STATUS_INFO[s.status] || { label: s.status, tone: 'dim' };
        const pct = Math.max(0, Math.min(100, s.progress || 0));
        return `
          <li class="session-card tone-${info.tone}">
            <span class="session-accent"></span>
            <div class="session-body">
              <div class="session-top">
                <span class="chip">${escapeHtml(PLATFORM_LABELS[s.platform] || s.platform)}</span>
                <span class="session-url" title="${escapeHtml(s.url)}">${escapeHtml(shortenUrl(s.url))}</span>
                <span class="badge tone-${info.tone}">${info.label}${s.status === 'downloading' ? '<i class="blink"></i>' : ''}</span>
              </div>
              ${s.title ? `<p class="session-title">${escapeHtml(s.title)}${s.uploader ? ` <span class="dim">· ${escapeHtml(s.uploader)}</span>` : ''}</p>` : ''}
              <div class="meter">
                <div class="meter-track"><div class="meter-fill" style="width:${pct}%"></div></div>
                <span class="meter-readout">${pct.toFixed(pct < 10 ? 2 : 1)}%</span>
              </div>
              <div class="session-stats">
                ${s.speed ? `<span>${escapeHtml(s.speed)}</span>` : ''}
                ${s.eta ? `<span>eta ${escapeHtml(s.eta)}</span>` : ''}
                ${s.size ? `<span>${escapeHtml(s.size)}</span>` : ''}
              </div>
              ${s.outputPath ? `<p class="session-note tone-complete">→ ${escapeHtml(s.outputPath)}</p>` : ''}
              ${s.errorMessage && s.status === 'error' ? `<p class="session-note tone-error">${escapeHtml(s.errorMessage)}</p>` : ''}
            </div>
            ${!finished ? `<button class="btn ghost small cancel-btn" data-id="${s.id}" type="button">cancel</button>` : ''}
          </li>`;
      }

      els.sessionList.addEventListener('click', async (e) => {
        const btn = e.target.closest('.cancel-btn');
        if (!btn) return;
        const id = btn.dataset.id;
        btn.disabled = true;
        try {
          await api('DELETE', `/api/download/${id}`);
          showToast('Cancellation requested.', 'info');
        } catch (err) {
          showToast(err.message, 'error');
          btn.disabled = false;
        }
      });

      async function refreshSessions() {
        try {
          syncFromList(await api('GET', '/api/downloads'));
        } catch { /* transient — next poll will retry */ }
      }

      // ---------- websocket ----------
      function setWsStatus(s) {
        els.wsStatus.dataset.state = s;
        els.wsStatus.querySelector('.label').textContent =
          s === 'live' ? 'live' : s === 'offline' ? 'offline — retrying' : 'connecting…';
      }

      function send(obj) {
        if (state.wsReady && state.ws.readyState === WebSocket.OPEN) state.ws.send(JSON.stringify(obj));
        else pendingSubs.push(obj);
      }
      function subscribe(id) {
        subscribedIds.add(id);
        send({ type: 'subscribe', session_id: id });
      }

      let reconnectDelay = 1000;
      function connectWs() {
        const proto = location.protocol === 'https:' ? 'wss' : 'ws';
        const ws = new WebSocket(`${proto}://${location.host}/ws`);
        state.ws = ws;
        ws.addEventListener('open', () => {
          state.wsReady = true;
          reconnectDelay = 1000;
          setWsStatus('live');
          subscribedIds.forEach((id) => send({ type: 'subscribe', session_id: id }));
          while (pendingSubs.length) ws.send(JSON.stringify(pendingSubs.shift()));
        });
        ws.addEventListener('message', (ev) => {
          try { handleWsMessage(JSON.parse(ev.data)); } catch { /* ignore malformed frames */ }
        });
        ws.addEventListener('close', () => {
          state.wsReady = false;
          setWsStatus('offline');
          setTimeout(connectWs, reconnectDelay);
          reconnectDelay = Math.min(reconnectDelay * 1.6, 15000);
        });
        ws.addEventListener('error', () => ws.close());
      }

      function handleWsMessage(msg) {
        switch (msg.type) {
          case 'status':
            updateSession(msg.session_id, { status: msg.status });
            break;
          case 'metadata':
            updateSession(msg.session_id, {
              title: msg.title, uploader: msg.uploader, thumbnail: msg.thumbnail, duration: msg.duration,
            });
            break;
          case 'progress':
            updateSession(msg.session_id, { progress: msg.percent, speed: msg.speed, eta: msg.eta, size: msg.size });
            break;
          case 'complete':
            updateSession(msg.session_id, { status: 'complete', progress: 100, outputPath: msg.output_path });
            break;
          case 'error':
            updateSession(msg.session_id, {
              status: msg.message === 'cancelled by user' ? 'cancelled' : 'error',
              errorMessage: msg.message,
            });
            break;
          default:
            break;
        }
      }
      setInterval(() => send({ type: 'ping' }), 25000);

      // ---------- settings drawer ----------
      function qualityOptions(current) {
        return QUALITIES.map((q) => `<option value="${q}" ${q === current ? 'selected' : ''}>${q}</option>`).join('');
      }
      function formatOptions(current) {
        return FORMATS.map((f) => `<option value="${f}" ${f === current ? 'selected' : ''}>${f}</option>`).join('');
      }
      const val = (id) => document.getElementById(id).value.trim();
      const checked = (id) => document.getElementById(id).checked;

      function renderSettings(cfg) {
        els.settingsBody.innerHTML = `
          <label class="field">
            <span class="field-label">download directory</span>
            <input type="text" id="cfg-download-path" value="${escapeHtml(cfg.download_path)}">
          </label>
          <div class="field-grid">
            <label class="field"><span class="field-label">default format</span><select id="cfg-default-format">${formatOptions(cfg.default_format)}</select></label>
            <label class="field"><span class="field-label">default quality</span><select id="cfg-default-quality">${qualityOptions(cfg.default_video_quality)}</select></label>
            <label class="field"><span class="field-label">search results</span><input type="number" min="1" max="50" id="cfg-search-count" value="${cfg.search_results_count}"></label>
          </div>
          <fieldset class="quality-grid">
            <legend>per-platform quality override</legend>
            ${['youtube', 'tiktok', 'instagram', 'twitter', 'spotify'].map((p) => `
              <label class="field"><span class="field-label">${p}</span><select id="cfg-pq-${p}">${qualityOptions(cfg.platform_quality[p])}</select></label>
            `).join('')}
          </fieldset>
          <div class="field-grid">
            <label class="field"><span class="field-label">cookies file</span><input type="text" id="cfg-cookies-file" placeholder="/path/to/cookies.txt" value="${escapeHtml(cfg.cookies_file || '')}"></label>
            <label class="field"><span class="field-label">cookies from browser</span><input type="text" id="cfg-cookies-browser" placeholder="firefox, chrome, …" value="${escapeHtml(cfg.cookies_from_browser || '')}"></label>
          </div>
          <p class="field-hint">Cookies file and browser extraction are mutually exclusive — filling one clears the other.</p>
          <div class="switch-row">
            <label class="rocker"><input type="checkbox" id="cfg-confirm" ${cfg.confirm_before_download ? 'checked' : ''}><span class="rocker-track"><span class="rocker-thumb"></span></span><span class="rocker-label">confirm before download (CLI)</span></label>
            <label class="rocker"><input type="checkbox" id="cfg-no-progress" ${cfg.no_progress ? 'checked' : ''}><span class="rocker-track"><span class="rocker-thumb"></span></span><span class="rocker-label">disable animated progress (CLI)</span></label>
            <label class="rocker"><input type="checkbox" id="cfg-termux" ${cfg.termux_mode ? 'checked' : ''}><span class="rocker-track"><span class="rocker-thumb"></span></span><span class="rocker-label">termux mode</span></label>
          </div>
          <label class="field">
            <span class="field-label">binaries directory <em>— advanced, do not change unless you know what you're doing</em></span>
            <input type="text" id="cfg-bins-dir" value="${escapeHtml(cfg.bins_dir)}">
          </label>`;

        const cookiesFile = document.getElementById('cfg-cookies-file');
        const cookiesBrowser = document.getElementById('cfg-cookies-browser');
        cookiesFile.addEventListener('input', () => { if (cookiesFile.value.trim()) cookiesBrowser.value = ''; });
        cookiesBrowser.addEventListener('input', () => { if (cookiesBrowser.value.trim()) cookiesFile.value = ''; });
      }

      function collectConfigPayload() {
        return {
          ...state.config,
          download_path: val('cfg-download-path'),
          default_format: val('cfg-default-format'),
          default_video_quality: val('cfg-default-quality'),
          platform_quality: {
            youtube: val('cfg-pq-youtube'),
            tiktok: val('cfg-pq-tiktok'),
            instagram: val('cfg-pq-instagram'),
            twitter: val('cfg-pq-twitter'),
            spotify: val('cfg-pq-spotify'),
          },
          bins_dir: val('cfg-bins-dir'),
          cookies_file: val('cfg-cookies-file') || null,
          cookies_from_browser: val('cfg-cookies-browser') || null,
          confirm_before_download: checked('cfg-confirm'),
          search_results_count: parseInt(val('cfg-search-count'), 10) || state.config.search_results_count,
          termux_mode: checked('cfg-termux'),
          no_progress: checked('cfg-no-progress'),
        };
      }

      async function loadConfig() {
        try {
          state.config = await api('GET', '/api/config');
          renderSettings(state.config);
        } catch (err) {
          els.settingsBody.innerHTML = `<p class="error-banner">Failed to load settings: ${escapeHtml(err.message)}</p>`;
        }
      }

      els.settingsSave.addEventListener('click', async () => {
        const payload = collectConfigPayload();
        if (payload.cookies_file && payload.cookies_from_browser) {
          showToast('Cookies file and browser extraction cannot both be set.', 'error');
          return;
        }
        setBusy(els.settingsSave, true);
        try {
          state.config = await api('PUT', '/api/config', payload);
          renderSettings(state.config);
          showToast('Settings saved to disk.', 'success');
        } catch (err) {
          showToast(err.message, 'error');
        } finally {
          setBusy(els.settingsSave, false);
        }
      });
      els.settingsReset.addEventListener('click', () => { if (state.config) renderSettings(state.config); });

      function openDrawer() {
        els.drawer.classList.add('open');
        els.drawerOverlay.classList.add('show');
        els.drawer.setAttribute('aria-hidden', 'false');
      }
      function closeDrawer() {
        els.drawer.classList.remove('open');
        els.drawerOverlay.classList.remove('show');
        els.drawer.setAttribute('aria-hidden', 'true');
      }
      els.settingsToggle.addEventListener('click', openDrawer);
      els.drawerClose.addEventListener('click', closeDrawer);
      els.drawerOverlay.addEventListener('click', closeDrawer);
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDrawer(); });

      // ---------- boot ----------
      els.serverAddr.textContent = location.host;
      connectWs();
      loadConfig();
      refreshSessions();
      setInterval(refreshSessions, 8000);
    })();
  </script>
</body>
</html>
